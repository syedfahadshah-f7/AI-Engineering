<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Segoe UI, system-ui, sans-serif" font-size="13">
  <rect width="900" height="360" fill="#fcfcfb"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#52514e"/></marker>
  </defs>
  <!-- browser -->
  <rect x="20" y="110" width="190" height="140" rx="12" fill="#fff" stroke="#c3c2b7"/>
  <text x="115" y="135" text-anchor="middle" font-weight="700">Browser (React + three.js)</text>
  <text x="115" y="160" text-anchor="middle" fill="#52514e">4 live race panels</text>
  <text x="115" y="180" text-anchor="middle" fill="#52514e">Benchmark dashboard</text>
  <text x="115" y="200" text-anchor="middle" fill="#52514e">Results slide</text>
  <text x="115" y="230" text-anchor="middle" fill="#898781" font-size="11">no API key here</text>
  <!-- backend -->
  <rect x="270" y="30" width="360" height="300" rx="12" fill="#fff" stroke="#c3c2b7"/>
  <text x="450" y="55" text-anchor="middle" font-weight="700">FastAPI backend</text>
  <rect x="290" y="70" width="150" height="70" rx="8" fill="#f4f5f7"/>
  <text x="365" y="95" text-anchor="middle" font-weight="600">Cube engine</text>
  <text x="365" y="115" text-anchor="middle" fill="#52514e" font-size="11">54 facelets · 18 HTM moves</text>
  <text x="365" y="130" text-anchor="middle" fill="#52514e" font-size="11">solved check</text>
  <rect x="460" y="70" width="150" height="70" rx="8" fill="#f4f5f7"/>
  <text x="535" y="95" text-anchor="middle" font-weight="600">Optimal solver</text>
  <text x="535" y="115" text-anchor="middle" fill="#52514e" font-size="11">bidirectional BFS</text>
  <text x="535" y="130" text-anchor="middle" fill="#52514e" font-size="11">exact shortest moves</text>
  <rect x="290" y="155" width="320" height="70" rx="8" fill="#f4f5f7"/>
  <text x="450" y="180" text-anchor="middle" font-weight="600">Race runner (same puzzle, same rules)</text>
  <text x="450" y="200" text-anchor="middle" fill="#52514e" font-size="11">state → model → validate move → apply → repeat</text>
  <text x="450" y="215" text-anchor="middle" fill="#52514e" font-size="11">timeouts · retries · invalid-output log · SSE events</text>
  <rect x="290" y="240" width="150" height="70" rx="8" fill="#f4f5f7"/>
  <text x="365" y="265" text-anchor="middle" font-weight="600">Adapters</text>
  <text x="365" y="285" text-anchor="middle" fill="#52514e" font-size="11">Decisions API · Chat</text>
  <text x="365" y="300" text-anchor="middle" fill="#52514e" font-size="11">key from .env only</text>
  <rect x="460" y="240" width="150" height="70" rx="8" fill="#f4f5f7"/>
  <text x="535" y="265" text-anchor="middle" font-weight="600">Results + stats</text>
  <text x="535" y="285" text-anchor="middle" fill="#52514e" font-size="11">JSON/CSV per session</text>
  <text x="535" y="300" text-anchor="middle" fill="#52514e" font-size="11">latency · success · gap</text>
  <!-- openrouter -->
  <rect x="690" y="70" width="190" height="240" rx="12" fill="#fff" stroke="#c3c2b7"/>
  <text x="785" y="95" text-anchor="middle" font-weight="700">OpenRouter</text>
  <text x="785" y="125" text-anchor="middle" font-weight="600" font-size="12">/api/alpha/decisions</text>
  <text x="785" y="145" text-anchor="middle" fill="#52514e" font-size="11">Jev 1.13</text>
  <text x="785" y="162" text-anchor="middle" fill="#52514e" font-size="11">GPT-6 Luna Decisions</text>
  <text x="785" y="179" text-anchor="middle" fill="#52514e" font-size="11">Cloudflare Clef</text>
  <text x="785" y="220" text-anchor="middle" font-weight="600" font-size="12">/api/v1/chat/completions</text>
  <text x="785" y="240" text-anchor="middle" fill="#52514e" font-size="11">Claude Opus 5.5</text>
  <text x="785" y="257" text-anchor="middle" fill="#898781" font-size="11">(JSON-schema move)</text>
  <!-- arrows -->
  <line x1="210" y1="165" x2="268" y2="165" stroke="#52514e" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="239" y="155" text-anchor="middle" fill="#52514e" font-size="11">REST</text>
  <line x1="268" y1="200" x2="212" y2="200" stroke="#52514e" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="239" y="218" text-anchor="middle" fill="#52514e" font-size="11">SSE</text>
  <line x1="440" y1="275" x2="688" y2="200" stroke="#52514e" stroke-width="1.5" marker-end="url(#a)"/>
</svg>
